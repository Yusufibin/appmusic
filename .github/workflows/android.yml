name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, lint and build
        working-directory: src
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            src/app/build/reports/tests/
            src/app/build/reports/lint-results-debug.html
            src/app/build/reports/previews/
      - uses: actions/upload-artifact@v4
        with:
          name: appmusic-debug
          path: src/app/build/outputs/apk/debug/app-debug.apk
